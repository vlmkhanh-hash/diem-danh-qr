<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Điểm danh bằng mã QR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      margin: 0;
      padding: 20px;
    }

    .khung {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.15);
    }

    h1 {
      color: #1e3a8a;
      margin-top: 0;
    }

    #reader {
      max-width: 500px;
      margin: 20px auto;
    }

    #ketQua {
      white-space: pre-line;
      padding: 18px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      background: #f1f5f9;
      min-height: 30px;
    }

    .xanh {
      background: #dcfce7 !important;
      color: #166534;
    }

    .do {
      background: #fee2e2 !important;
      color: #991b1b;
    }

    .vang {
      background: #fef3c7 !important;
      color: #92400e;
    }
  </style>
</head>

<body>

  <div class="khung">
    <h1>ĐIỂM DANH BẰNG MÃ QR</h1>

    <p>Đưa mã QR vào giữa khung camera.</p>

    <div id="reader"></div>

    <div id="ketQua">
      Sẵn sàng quét mã QR
    </div>
  </div>

  <script>
    // DÁN ĐƯỜNG DẪN APPS SCRIPT CỦA THẦY VÀO GIỮA HAI DẤU NGOẶC KÉP
    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbxt3lyP1-PRl9mMOH1o7v1sgIkXBnR51-Of-7Wurcc-NG88r8RO5H3eBFSiGhuh8T0B9A/exec";

    let dangXuLy = false;
    let maVuaQuet = "";
    let scanner = null;
    let scriptDangGui = null;

    function hienThi(noiDung, lop) {
      const ketQua = document.getElementById("ketQua");
      ketQua.textContent = noiDung;
      ketQua.className = lop || "";
    }

    function xoaScriptDangGui() {
      if (scriptDangGui) {
        scriptDangGui.remove();
        scriptDangGui = null;
      }
    }

    function moKhoaQuetSau(delay) {
      setTimeout(function() {
        dangXuLy = false;
        maVuaQuet = "";
        hienThi("Sẵn sàng quét mã QR", "");

        // Bật lại camera
        if (scanner) {
          try {
            scanner.resume();
          } catch (loi) {
            console.log("Không cần resume camera:", loi);
          }
        }
      }, delay);
    }

    function guiMaQR(maQR) {
      maQR = String(maQR || "").trim().toUpperCase();

      if (!maQR) {
        return;
      }

      // Chặn ngay từ trình duyệt
      if (dangXuLy) {
        return;
      }

      if (maQR === maVuaQuet) {
        return;
      }

      dangXuLy = true;
      maVuaQuet = maQR;

      // Dừng quét ngay sau lần nhận đầu tiên
      if (scanner) {
        try {
          scanner.pause(true);
        } catch (loi) {
          console.log("Không thể pause camera:", loi);
        }
      }

      hienThi("Đang kiểm tra mã: " + maQR, "vang");

      const tenHam = "nhanKetQua_" + Date.now();

      let daNhanKetQua = false;

      window[tenHam] = function(ketQua) {
        if (daNhanKetQua) {
          return;
        }

        daNhanKetQua = true;

        xoaScriptDangGui();

        if (ketQua && ketQua.thanhCong) {
          hienThi(
            "✓ " + ketQua.hoTen +
            "\nLớp: " + ketQua.lop +
            "\nĐiểm danh thành công",
            "xanh"
          );
        } else {
          hienThi(
            "⚠ " + (ketQua.thongBao || "Không thể điểm danh"),
            "do"
          );
        }

        delete window[tenHam];

        // Chỉ mở lại sau 2,5 giây
        moKhoaQuetSau(2500);
      };

      scriptDangGui = document.createElement("script");

      scriptDangGui.src =
        URL_APPS_SCRIPT +
        "?maQR=" + encodeURIComponent(maQR) +
        "&callback=" + encodeURIComponent(tenHam);

      scriptDangGui.noscript = function() {
        if (daNhanKetQua) {
          return;
        }

        daNhanKetQua = true;

        xoaScriptDangGui();
        delete window[tenHam];

        hienThi("Lỗi kết nối Google Sheets", "do");

        // Mở lại camera sau 3 giây nếu có lỗi
        moKhoaQuetSau(3000);
      };

      document.body.appendChild(scriptDangGui);
    }

    function khiQuetThanhCong(maQR) {
      guiMaQR(maQR);
    }

    function khiQuetThatBai() {
      // Không hiển thị lỗi liên tục khi camera chưa nhận diện được mã
    }

    scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 300,
          height: 300
        },
        rememberLastUsedCamera: true
      },
      false
    );

    scanner.render(
      khiQuetThanhCong,
      khiQuetThatBai
    );
  </script>

</body>
</html>
