<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Điểm danh QR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2ff;
      margin: 0;
      padding: 20px;
    }

    .khung {
      max-width: 650px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 3px 15px rgba(0,0,0,0.15);
    }

    h1 {
      color: #1e3a8a;
    }

    #reader {
      max-width: 500px;
      margin: 20px auto;
    }

    #ketQua {
      white-space: pre-line;
      padding: 18px;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      background: #f1f5f9;
    }

    .xanh {
      background: #dcfce7 !important;
      color: #166534;
    }

    .do {
      background: #fee2e2 !important;
      color: #991b1b;
    }

    .vang {
      background: #fef3c7 !important;
      color: #92400e;
    }
  </style>
</head>

<body>

  <div class="khung">
    <h1>ĐIỂM DANH BẰNG MÃ QR</h1>

    <p>Đưa mã QR của học sinh vào giữa khung camera.</p>

    <div id="reader"></div>

    <div id="ketQua">
      Sẵn sàng quét mã QR
    </div>
  </div>

  <script>
    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycbwM1DtBF6Vhd4h8CErnbM9b1zsrhnbcFxnoeAkkpmV1Z3UfN9p133V0EjlZL8KsAX50/exec";

    let dangXuLy = false;
    let maVuaQuet = "";

    function hienThi(noiDung, lop) {
      const ketQua = document.getElementById("ketQua");
      ketQua.textContent = noiDung;
      ketQua.className = lop || "";
    }

    function taoTenHam() {
      return "nhanKetQua_" + Date.now();
    }

    function guiMaQR(maQR) {
      if (dangXuLy) return;
      if (maQR === maVuaQuet) return;

      dangXuLy = true;
      maVuaQuet = maQR;

      hienThi("Đang kiểm tra mã: " + maQR, "vang");

      const tenHam = taoTenHam();

      window[tenHam] = function(ketQua) {
        if (ketQua.thanhCong) {
          hienThi(
            "✓ " + ketQua.hoTen +
            " - Lớp " + ketQua.lop +
            "\nĐiểm danh thành công",
            "xanh"
          );
        } else {
          hienThi(
            "⚠ " + ketQua.thongBao,
            "do"
          );
        }

        xoaTheScript();

        setTimeout(function() {
          dangXuLy = false;
          maVuaQuet = "";
          hienThi("Sẵn sàng quét mã QR", "");
        }, 2500);
      };

      const theScript = document.createElement("script");

      theScript.src =
        URL_APPS_SCRIPT +
        "?maQR=" + encodeURIComponent(maQR) +
        "&callback=" + tenHam;

      theScript.id = "script-" + tenHam;

      theScript.noscript = function() {
        hienThi("Lỗi kết nối Google Sheets", "do");
        xoaTheScript();

        setTimeout(function() {
          dangXuLy = false;
          maVuaQuet = "";
          hienThi("Sẵn sàng quét mã QR", "");
        }, 2500);
      };

      document.body.appendChild(theScript);

      function xoaTheScript() {
        const theCu = document.getElementById("script-" + tenHam);
        if (theCu) {
          theCu.remove();
        }

        delete window[tenHam];
      }
    }

    function khiQuetThanhCong(maQR) {
      maQR = String(maQR).trim().toUpperCase();
      guiMaQR(maQR);
    }

    function khiQuetThatBai() {
      // Không hiển thị lỗi liên tục khi camera chưa đọc được mã
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 300,
          height: 300
        }
      },
      false
    );

    scanner.render(
      khiQuetThanhCong,
      khiQuetThatBai
    );
  </script>

</body>
</html>
